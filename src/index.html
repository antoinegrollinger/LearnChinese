<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hanzi Workshop</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 语 icon: SVG for current browsers, .ico for older ones, PNG for iPhone home screens. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script>
      // The theme you chose (ThemeService), before the page is drawn: no flash of the other one.
      try {
        var theme = localStorage.getItem('hanzi-workshop-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
