<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hanzi Workshop</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // The theme you chose (ThemeService), before the page is drawn: no flash of the other one.
      try {
        var theme = localStorage.getItem('hanzi-workshop-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
